<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="velura.js"></script>
<style>
  body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; color: #1C2528; background: #FBFAF7; -webkit-font-smoothing: antialiased; }
  a { color: #3E9C9A; text-decoration: none; }
  a:hover { color: #0E3B52; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  [data-reveal] { opacity: 0; transform: translateY(16px); transition: opacity 700ms cubic-bezier(.2,.7,.2,1), transform 700ms cubic-bezier(.2,.7,.2,1); }
  [data-reveal][data-revealed] { opacity: 1; transform: none; }
  .velura-serif { font-family: 'Cormorant Garamond', 'Times New Roman', serif; letter-spacing: 0.01em; }
  @keyframes velura-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .velura-dot-live { animation: velura-pulse 2.2s ease-in-out infinite; }
  @media (max-width: 1180px) { .velura-desk { display: none !important; } }
  @media (min-width: 1181px) { .velura-mob { display: none !important; } }
  @media (max-width: 860px) {
    body { padding-bottom: 82px; }
    main > section { padding-top: 24px !important; padding-bottom: 24px !important; }
    main h1 { font-size: 40px !important; line-height: 1.08 !important; }
    img, video { max-width: 100%; }
    .vcol2-mob, .vcol3-mob, .vcol4-mob, .vcol6-mob, .vsplit-mob, .vfooter-grid { grid-template-columns: 1fr !important; }
    .vcol2-mob > *, .vcol3-mob > *, .vcol4-mob > *, .vcol6-mob > *, .vsplit-mob > *, .vfooter-grid > * { min-width: 0; }
    .vhide-mob { display: none !important; }
    .vemerge-grid { grid-template-columns: 1fr !important; }
    svg { max-width: 100%; height: auto; }
    .vcookie { flex-direction: column !important; align-items: stretch !important; gap: 14px !important; left: 12px !important; right: 12px !important; bottom: 90px !important; padding: 18px !important; }
    .vcookie > div:last-child > button { flex: 1; }
    .vprice-row { grid-template-columns: minmax(0, 1fr) auto !important; gap: 12px !important; }
    .vprice-row > :last-child { white-space: normal !important; font-size: 18px !important; text-align: right; max-width: 9em; }
    h1, h2, h3, main p, main li { overflow-wrap: break-word; hyphens: auto; }
    main a[style*="nowrap"], main button[style*="nowrap"] { white-space: normal !important; text-align: center; }
  }
  .velura-nav-item { position: relative; display: inline-flex; align-items: center; }
  .velura-nav-item:hover > .velura-dropdown,
  .velura-nav-item:focus-within > .velura-dropdown { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
  .velura-dropdown { position: absolute; top: 100%; left: 50%; transform: translate(-50%, -8px); margin-top: 8px; min-width: 520px; background: #FBFAF7; border: 1px solid rgba(14,59,82,0.08); border-radius: 18px; box-shadow: 0 24px 48px rgba(14,59,82,0.14); padding: 18px; opacity: 0; visibility: hidden; transition: opacity 180ms ease, transform 180ms ease, visibility 180ms; pointer-events: none; z-index: 110; }
  .velura-dropdown::before { content: ""; position: absolute; top: -8px; left: 0; right: 0; height: 8px; }
  .velura-dropdown-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .velura-dropdown-link { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 10px; color: #1C2528; text-decoration: none; transition: background 160ms ease; }
  .velura-dropdown-link:hover { background: #F3EEE6; }
  .velura-dropdown-link .vd-name { font-size: 14.5px; font-weight: 600; color: #0E3B52; }
  .velura-dropdown-link .vd-from { font-size: 12px; color: #3E9C9A; font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; }
  .velura-dropdown-footer { margin-top: 10px; padding: 12px 14px 4px; border-top: 1px solid rgba(14,59,82,0.08); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .velura-dropdown-footer a { font-size: 13.5px; font-weight: 600; color: #0E3B52; }
</style>
</helmet>
<header ref="{{ setHeaderRef }}" style="position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(251,250,247,0.95); border-bottom: 1px solid rgba(14,59,82,0.08); backdrop-filter: saturate(1.1) blur(10px); -webkit-backdrop-filter: saturate(1.1) blur(10px);">
  <div style="background: #0E3B52; color: #E7EEF2; font-size: 13px;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 8px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
      <div class="velura-desk" style="display: flex; align-items: center; gap: 24px;">
        <a href="{{ phoneHref }}" style="color: #E7EEF2; display: inline-flex; align-items: center; gap: 8px; letter-spacing: 0.01em;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="#3E9C9A" stroke-width="1.6" stroke-linejoin="round" /></svg>
          {{ phone }}
        </a>
        <span style="display: inline-flex; align-items: center; gap: 8px; color: #B7C8D1;">
          <span class="velura-dot-live" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2E8B57;" style-hover="{{ hoverDot }}">{{ dotOverride }}</span>
          {{ statusLabel }}
        </span>
      </div>
      <div class="velura-desk">
        <a href="{{ phoneHref }}" style="color: #F3B8AD; display: inline-flex; align-items: center; gap: 8px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #C2412D; display: inline-block;"></span>
          {{ emergencyLabel }}
        </a>
      </div>
      <div class="velura-mob" style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #B7C8D1;">{{ statusLabel }}</span>
        <a href="{{ phoneHref }}" style="color: #F3B8AD;">{{ emergencyShort }}</a>
      </div>
    </div>
  </div>

  <div style="max-width: 1280px; margin: 0 auto; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #0E3B52;">
      <span class="velura-serif" style="font-size: 30px; font-weight: 600; letter-spacing: 0.24em; line-height: 1; color: #0E3B52;">VELURA</span>
      <svg width="88" height="8" viewBox="0 0 88 8" fill="none" style="margin-top: 2px;">
        <path d="M2 5 Q 22 -1 44 4 T 86 3" stroke="#3E9C9A" stroke-width="1.5" fill="none" stroke-linecap="round" />
      </svg>
      <span style="font-size: 9.5px; letter-spacing: 0.26em; color: #5D6B70; font-weight: 500;">DENTAL CLINIC · SPLIT</span>
    </a>

    <nav class="velura-desk" style="display: flex; align-items: center; gap: 2px;">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="7">
        <div class="velura-nav-item">
          <a href="{{ item.href }}" style="{{ item.style }}" style-hover="{{ hoverLink }}">
            {{ item.label }}
            <sc-if value="{{ item.dropdown }}" hint-placeholder-val="{{ false }}">
              <svg width="10" height="10" viewBox="0 0 10 10" style="opacity: 0.6; margin-left: 4px;"><path d="M2 3.5 L5 7 L8 3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" /></svg>
            </sc-if>
          </a>
          <sc-if value="{{ item.dropdown }}" hint-placeholder-val="{{ false }}">
            <div class="velura-dropdown" role="menu">
              <div class="velura-dropdown-grid">
                <sc-for list="{{ treatmentLinks }}" as="tl" hint-placeholder-count="8">
                  <a class="velura-dropdown-link" href="{{ tl.slug }}" role="menuitem">
                    <span class="vd-name">{{ tl.name }}</span>
                    <span class="vd-from">{{ tl.from }}</span>
                  </a>
                </sc-for>
              </div>
              <div class="velura-dropdown-footer">
                <span style="font-size: 12.5px; color: #5D6B70;">{{ dropdownHint }}</span>
                <a href="Treatments.dc.html">{{ dropdownAllLabel }} →</a>
              </div>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </nav>

    <div class="velura-desk" style="display: flex; align-items: center; gap: 14px;">
      <div style="display: flex; align-items: center; background: #F3EEE6; border-radius: 999px; padding: 4px; gap: 2px;">
        <sc-for list="{{ langs }}" as="lg" hint-placeholder-count="3">
          <button onClick="{{ lg.onClick }}" style="{{ lg.style }}">{{ lg.label }}</button>
        </sc-for>
      </div>
      <a href="Contact.dc.html" style="background: #3E9C9A; color: #FBFAF7; padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 14px; letter-spacing: 0.01em; box-shadow: 0 6px 18px rgba(62,156,154,0.28);" style-hover="{{ hoverCta }}">{{ bookLabel }}</a>
    </div>

    <button class="velura-mob" onClick="{{ toggleMenu }}" aria-label="Menu" style="width: 44px; height: 44px; border: 1px solid rgba(14,59,82,0.15); background: transparent; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer;">
      <span style="display: block; width: 18px; height: 1.5px; background: #0E3B52;"></span>
      <span style="display: block; width: 18px; height: 1.5px; background: #0E3B52;"></span>
      <span style="display: block; width: 18px; height: 1.5px; background: #0E3B52;"></span>
    </button>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="velura-mob" style="background: #FBFAF7; border-top: 1px solid rgba(14,59,82,0.08); padding: 10px 24px 28px;">
      <sc-for list="{{ nav }}" as="item" hint-placeholder-count="7">
        <a href="{{ item.href }}" style="display: block; padding: 14px 4px; font-size: 17px; font-weight: 500; color: #1C2528; border-bottom: 1px solid rgba(14,59,82,0.06);">{{ item.label }}</a>
      </sc-for>
      <div style="display: flex; gap: 8px; margin-top: 20px;">
        <sc-for list="{{ langs }}" as="lg" hint-placeholder-count="3">
          <button onClick="{{ lg.onClick }}" style="{{ lg.mobStyle }}">{{ lg.label }}</button>
        </sc-for>
      </div>
      <a href="Contact.dc.html" style="display: block; text-align: center; margin-top: 18px; background: #3E9C9A; color: #FBFAF7; padding: 16px 20px; border-radius: 999px; font-weight: 600;">{{ bookLabel }}</a>
    </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;140px&quot;},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { status: { state: "open", time: "20:00", open: true }, menuOpen: false, lang: (window.VELURA && window.VELURA.getLang && window.VELURA.getLang()) || "EN" };

  componentDidMount() {
    this.refresh();
    this._t = setInterval(() => this.refresh(), 60000);
    this._onLang = (e) => this.setState({ lang: (e && e.detail) || window.VELURA.getLang() });
    window.addEventListener("velura:lang", this._onLang);
    this._syncPad = () => {
      if (!this._headerEl) return;
      const h = this._headerEl.getBoundingClientRect().height;
      document.body.style.paddingTop = Math.round(h) + "px";
    };
    this._syncPad();
    window.addEventListener("resize", this._syncPad);
    if (window.ResizeObserver && this._headerEl) {
      this._ro = new ResizeObserver(this._syncPad);
      this._ro.observe(this._headerEl);
    }
  }
  componentWillUnmount() {
    clearInterval(this._t);
    window.removeEventListener("velura:lang", this._onLang);
    window.removeEventListener("resize", this._syncPad);
    if (this._ro) this._ro.disconnect();
    document.body.style.paddingTop = "";
  }
  refresh() {
    const V = window.VELURA;
    if (!V) return;
    const s = V.liveStatus();
    this.setState({ status: s });
  }

  renderVals() {
    const V = window.VELURA || {};
    const current = this.props.current || "home";
    const navRaw = V.NAV || [];
    const t = V.t || ((k) => k);
    const status = this.state.status || { state: "open", time: "20:00", open: true };
    const statusLabel = V.statusLabel ? V.statusLabel(status) : "";
    const baseLink = {
      padding: "10px 14px",
      fontSize: "14.5px",
      fontWeight: 500,
      color: "#1C2528",
      borderRadius: "10px",
      display: "inline-flex",
      alignItems: "center",
      gap: "6px",
      position: "relative",
      transition: "background 180ms ease, color 180ms ease",
    };
    const activeLink = { ...baseLink, background: "#F3EEE6", color: "#0E3B52", fontWeight: 600 };
    const nav = navRaw.map(n => ({
      ...n,
      label: t(n.labelKey),
      style: n.key === current ? activeLink : baseLink,
    }));

    const langs = ["EN", "HR", "DE"].map(l => {
      const active = l === this.state.lang;
      return {
        label: l,
        onClick: () => { if (V.setLang) V.setLang(l); this.setState({ lang: l }); },
        style: {
          border: "none",
          background: active ? "#FBFAF7" : "transparent",
          color: active ? "#0E3B52" : "#5D6B70",
          padding: "6px 12px",
          borderRadius: "999px",
          fontWeight: 600,
          fontSize: "12.5px",
          cursor: "pointer",
          boxShadow: active ? "0 1px 3px rgba(14,59,82,0.08)" : "none",
          fontFamily: "inherit",
          transition: "all 180ms ease",
        },
        mobStyle: {
          border: "1px solid rgba(14,59,82,0.15)",
          background: active ? "#0E3B52" : "transparent",
          color: active ? "#FBFAF7" : "#1C2528",
          padding: "10px 18px",
          borderRadius: "999px",
          fontWeight: 600,
          fontSize: "14px",
          cursor: "pointer",
          flex: 1,
          fontFamily: "inherit",
        },
      };
    });

    return {
      nav,
      langs,
      hoverLink: { background: "rgba(62,156,154,0.10)", color: "#0E3B52" },
      hoverCta: { background: "#0E3B52", boxShadow: "0 8px 22px rgba(14,59,82,0.3)" },
      hoverDot: {},
      dotOverride: "",
      phone: V.CONTACT ? V.CONTACT.phone : "+385 21 000 000",
      phoneHref: V.CONTACT ? V.CONTACT.phoneHref : "tel:+38521000000",
      statusLabel,
      bookLabel: t("cta.book"),
      emergencyLabel: t("cta.emergency"),
      emergencyShort: t("cta.emergencyShort"),
      treatmentLinks: (V.TREATMENTS || []),
      dropdownHint: this.state.lang === "HR" ? "Sve naše terapije" : this.state.lang === "DE" ? "Alle unsere Behandlungen" : "All our treatments",
      dropdownAllLabel: this.state.lang === "HR" ? "Pogledaj sve" : this.state.lang === "DE" ? "Alle ansehen" : "See all",
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      setHeaderRef: (el) => { this._headerEl = el; if (el) setTimeout(() => this._syncPad && this._syncPad(), 0); },
    };
  }
}
</script>
</body>
</html>
