<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="velura.js"></script>
<style>
  @media (min-width: 1181px) { .velura-mobbar { display: none !important; } }
</style>
</helmet>
<div class="velura-mobbar" style="position: fixed; bottom: 0; left: 0; right: 0; background: #FBFAF7; border-top: 1px solid rgba(14,59,82,0.1); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; z-index: 90; box-shadow: 0 -10px 30px rgba(14,59,82,0.07);">
  <a href="{{ phoneHref }}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: #F3EEE6; border-radius: 14px; color: #0E3B52; font-size: 12.5px; font-weight: 600;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" stroke="#0E3B52" stroke-width="1.6" stroke-linejoin="round" /></svg>
    {{ callLabel }}
  </a>
  <a href="{{ whatsappHref }}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: #E8F2F2; border-radius: 14px; color: #0E3B52; font-size: 12.5px; font-weight: 600;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#3E9C9A"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.3A10 10 0 1 0 12 2zm5.7 14.2c-.2.6-1.2 1.1-1.8 1.2-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .6l-.3.4-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.8 2.1 1.2 1.1 2.3 1.4 2.6 1.6.3.1.5.1.6 0l.9-1.1c.2-.3.4-.2.7-.1l1.9 1c.2.1.4.2.5.3 0 .2 0 .8-.2 1.3z"/></svg>
    {{ waLabel }}
  </a>
  <a href="Contact.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; background: #3E9C9A; border-radius: 14px; color: #FBFAF7; font-size: 12.5px; font-weight: 600;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="2" stroke="#FBFAF7" stroke-width="1.6" /><path d="M4 9h16" stroke="#FBFAF7" stroke-width="1.6" /><path d="M9 3v4M15 3v4" stroke="#FBFAF7" stroke-width="1.6" stroke-linecap="round" /></svg>
    {{ bookLabel }}
  </a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;375px&quot;,&quot;height&quot;:&quot;120px&quot;}}">
class Component extends DCLogic {
  state = { lang: (window.VELURA && window.VELURA.getLang && window.VELURA.getLang()) || "EN" };
  componentDidMount() {
    this._onLang = (e) => this.setState({ lang: (e && e.detail) || window.VELURA.getLang() });
    window.addEventListener("velura:lang", this._onLang);
  }
  componentWillUnmount() { window.removeEventListener("velura:lang", this._onLang); }
  renderVals() {
    const V = window.VELURA || {};
    const c = V.CONTACT || {};
    const t = V.t || ((k) => k);
    return {
      phoneHref: c.phoneHref || "tel:+38521000000",
      whatsappHref: c.whatsappHref || "https://wa.me/38521000000",
      callLabel: t("mobile.call"),
      waLabel: t("mobile.whatsapp"),
      bookLabel: t("mobile.book"),
    };
  }
}
</script>
</body>
</html>
