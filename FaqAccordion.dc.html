<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="velura.js"></script>
</helmet>
<div style="display: flex; flex-direction: column; gap: 12px;">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
    <div style="{{ it.wrapStyle }}">
      <button onClick="{{ it.onToggle }}" style="width: 100%; text-align: left; background: transparent; border: none; padding: 22px 26px; display: flex; justify-content: space-between; align-items: center; gap: 20px; cursor: pointer; font-family: inherit;">
        <span style="font-size: 17px; color: #0E3B52; font-weight: 600; letter-spacing: -0.005em;">{{ it.q }}</span>
        <span style="{{ it.plusStyle }}">+</span>
      </button>
      <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 0 26px 24px; font-size: 16px; line-height: 1.7; color: #5D6B70; max-width: 820px;">{{ it.a }}</div>
      </sc-if>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;800px&quot;,&quot;height&quot;:&quot;400px&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{q:string,a:string}&gt;&quot;}}">
class Component extends DCLogic {
  state = { openIndex: 0 };
  renderVals() {
    const raw = this.props.items || [];
    const openIndex = this.state.openIndex;
    const items = raw.map((it, i) => {
      const open = i === openIndex;
      return {
        q: it.q,
        a: it.a,
        open,
        onToggle: () => this.setState({ openIndex: open ? -1 : i }),
        wrapStyle: {
          background: open ? "#FBFAF7" : "#F3EEE6",
          border: "1px solid " + (open ? "rgba(62,156,154,0.35)" : "rgba(14,59,82,0.06)"),
          borderRadius: "16px",
          overflow: "hidden",
          transition: "background 200ms ease, border-color 200ms ease",
        },
        plusStyle: {
          width: "32px",
          height: "32px",
          borderRadius: "50%",
          background: open ? "#3E9C9A" : "rgba(14,59,82,0.06)",
          color: open ? "#FBFAF7" : "#0E3B52",
          display: "inline-flex",
          alignItems: "center",
          justifyContent: "center",
          fontSize: "22px",
          fontWeight: 300,
          transform: open ? "rotate(45deg)" : "rotate(0)",
          transition: "all 220ms cubic-bezier(.2,.7,.2,1)",
          flexShrink: 0,
        },
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
